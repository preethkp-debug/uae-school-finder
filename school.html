<style>

  :root {
    --ink:           #0f1419;
    --ink-soft:      #4a5159;
    --ink-muted:     #767e85;
    --ink-line:      #e7e5e0;
    --ink-hairline:  #efece6;
    --bg:            #ffffff;
    --bg-cream:      #faf7f2;
    --bg-cream-2:    #f4efe6;
    --accent:        #c66b3d;
    --accent-soft:   #f4d2bd;
    --green:         #2f7a4d;
    --green-soft:    #d9ecdf;
    --amber:         #c08a3a;
    --amber-soft:    #f3e0bf;
    --rose:          #b14747;
    --rose-soft:     #f1d4d4;
    --blue:          #2554a8;
    --blue-soft:     #d6e1f3;
    --shadow-card:   0 1px 2px rgba(15,20,25,0.04), 0 4px 12px rgba(15,20,25,0.04);
    --shadow-pop:    0 8px 30px rgba(15,20,25,0.10);
    --radius-pill:   999px;
    --radius-card:   18px;
    --radius-search: 28px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg); color: var(--ink); line-height: 1.55; font-size: 15px;
    -webkit-font-smoothing: antialiased; min-height: 100vh;
  }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; cursor: pointer; background: none; border: none; color: inherit; }
  .serif { font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; letter-spacing: -0.01em; }
  .container { max-width: 1320px; margin: 0 auto; padding: 0 24px; }
  @media (max-width: 640px) { .container { padding: 0 16px; } }
  header {
    position: sticky; top: 0; z-index: 50;
    background: rgba(255,255,255,0.85);
    backdrop-filter: saturate(180%) blur(10px);
    -webkit-backdrop-filter: saturate(180%) blur(10px);
    border-bottom: 1px solid var(--ink-line);
  }
  .header-inner { display: flex; align-items: center; justify-content: space-between; height: 72px; gap: 16px; }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; letter-spacing: -0.02em; }
  .logo-mark { width: 30px; height: 30px; border-radius: 8px; background: var(--ink); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px; }
  .logo-sub { color: var(--ink-soft); font-weight: 500; font-size: 14px; border-left: 1px solid var(--ink-line); padding-left: 12px; }
  @media (max-width: 720px) { .logo-sub { display: none; } }
  .header-nav { display: flex; align-items: center; gap: 8px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: var(--radius-pill); border: 1px solid transparent; font-size: 14px; font-weight: 500; transition: all .15s; }
  .pill:hover { background: var(--bg-cream); }
  .pill.outline { border-color: var(--ink-hairline); }
  .pill.outline:hover { box-shadow: var(--shadow-card); background: #fff; }
  .pill.dark { background: var(--ink); color: #fff; }
  .pill.dark:hover { background: #2a2f35; }
  .badge {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 4px 12px; border-radius: var(--radius-pill);
    font-size: 12px; font-weight: 600; letter-spacing: 0.02em;
    background: var(--bg-cream); color: var(--ink-soft);
    border: 1px solid var(--ink-hairline);
  }
  .badge.type-school { background: var(--blue-soft); color: var(--blue); border-color: transparent; }
  .badge.type-nursery { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
  .badge.rating-outstanding { background: var(--green-soft); color: var(--green); border-color: transparent; }
  .badge.rating-very-good { background: #e0f1da; color: #4f8c2c; border-color: transparent; }
  .badge.rating-good { background: var(--amber-soft); color: var(--amber); border-color: transparent; }
  .badge.rating-acceptable { background: #f5e6c4; color: #8a6a18; border-color: transparent; }
  .badge.rating-weak { background: var(--rose-soft); color: var(--rose); border-color: transparent; }
  footer { background: var(--bg-cream); border-top: 1px solid var(--ink-hairline); padding: 36px 0; margin-top: 60px; }
  .footer-inner { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; color: var(--ink-soft); font-size: 13px; }
  .footer-links { display: flex; gap: 16px; }
  .footer-links a:hover { color: var(--ink); }


  /* ============================================================ HERO */
  .hero {
    padding: 36px 0 28px;
    background: linear-gradient(180deg, var(--bg-cream) 0%, #fff 100%);
    border-bottom: 1px solid var(--ink-hairline);
  }
  .breadcrumb { color: var(--ink-soft); font-size: 13px; margin-bottom: 18px; }
  .breadcrumb a:hover { color: var(--ink); text-decoration: underline; }
  .breadcrumb .sep { margin: 0 8px; color: var(--ink-muted); }
  .school-title-row { display: flex; gap: 24px; align-items: flex-start; flex-wrap: wrap; }
  .school-title-row .left { flex: 1; min-width: 280px; }
  .school-title-row h1 {
    font-family: 'Instrument Serif', Georgia, serif; font-weight: 400;
    font-size: clamp(32px, 4vw, 52px); letter-spacing: -0.02em; line-height: 1.05;
    margin: 12px 0; color: var(--ink);
  }
  .school-meta { color: var(--ink-soft); font-size: 15px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .school-meta svg { flex-shrink: 0; }
  .badge-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }

  /* ============================================================ MAIN */
  main { padding: 36px 0 60px; }
  .detail-grid { display: grid; grid-template-columns: 1fr 380px; gap: 36px; align-items: start; }
  @media (max-width: 960px) { .detail-grid { grid-template-columns: 1fr; gap: 24px; } }

  /* ============================================================ ABOUT (left column) */
  .about-section { background: #fff; }
  .section-card {
    background: #fff; border: 1px solid var(--ink-hairline);
    border-radius: var(--radius-card); padding: 28px; margin-bottom: 18px;
  }
  .section-card h2 {
    font-family: 'Instrument Serif', Georgia, serif; font-weight: 400;
    font-size: 28px; letter-spacing: -0.01em; line-height: 1.1;
    margin-bottom: 14px; color: var(--ink);
  }
  .section-card h3 {
    font-size: 16px; font-weight: 600; margin: 22px 0 8px; color: var(--ink);
  }
  .section-card p {
    color: var(--ink-soft); font-size: 15px; line-height: 1.7; margin-bottom: 12px;
  }
  .section-card ul { padding-left: 22px; color: var(--ink-soft); font-size: 15px; line-height: 1.7; }
  .section-card ul li { margin-bottom: 6px; }
  .info-prose strong { color: var(--ink); font-weight: 600; }
  .info-prose .accent { color: var(--accent); font-weight: 600; }

  /* Quick contact strip */
  .quick-contact {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 14px; margin-top: 18px;
  }
  .qc-item {
    background: var(--bg-cream); padding: 14px 16px; border-radius: 12px;
    border: 1px solid var(--ink-hairline);
  }
  .qc-label { font-size: 11px; text-transform: uppercase; color: var(--ink-muted); letter-spacing: 0.06em; margin-bottom: 4px; }
  .qc-value { font-size: 14px; font-weight: 500; color: var(--ink); }
  .qc-value.muted { color: var(--ink-muted); font-style: italic; font-weight: 400; }

  /* ============================================================ GLANCE CARD (right column) */
  .glance-card {
    background: #fff; border: 1px solid var(--ink-line);
    border-radius: var(--radius-card); padding: 24px;
    position: sticky; top: 96px;
    box-shadow: var(--shadow-card);
  }
  @media (max-width: 960px) { .glance-card { position: static; } }
  .glance-card h3 {
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--ink-muted); margin-bottom: 16px;
  }
  .glance-list { display: flex; flex-direction: column; gap: 0; }
  .glance-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 0; border-bottom: 1px solid var(--ink-hairline);
    gap: 12px;
  }
  .glance-row:last-child { border-bottom: none; }
  .glance-key {
    font-size: 13px; color: var(--ink-soft); font-weight: 500;
    display: flex; align-items: center; gap: 6px; flex-shrink: 0;
  }
  .glance-key svg { color: var(--ink-muted); }
  .glance-value {
    font-size: 14px; font-weight: 600; color: var(--ink); text-align: right;
    word-break: break-word;
  }
  .glance-value.muted { color: var(--ink-muted); font-style: italic; font-weight: 400; }
  .glance-actions { display: flex; flex-direction: column; gap: 8px; margin-top: 18px; }
  .action-btn {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    padding: 12px 18px; border-radius: var(--radius-pill);
    font-size: 14px; font-weight: 600;
    transition: all .15s;
  }
  .action-btn.primary { background: var(--ink); color: #fff; }
  .action-btn.primary:hover { background: #2a2f35; }
  .action-btn.secondary {
    background: #fff; color: var(--ink); border: 1px solid var(--ink-line);
  }
  .action-btn.secondary:hover { border-color: var(--ink); background: var(--bg-cream); }

  /* ============================================================ NEARBY */
  .nearby-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
  .nearby-card {
    background: #fff; border: 1px solid var(--ink-hairline);
    border-radius: var(--radius-card); padding: 18px;
    transition: all .15s;
    display: flex; flex-direction: column; gap: 8px;
  }
  .nearby-card:hover { border-color: var(--ink-line); box-shadow: var(--shadow-card); }
  .nearby-card h4 { font-size: 15px; font-weight: 600; line-height: 1.3; color: var(--ink); }
  .nearby-card .nb-meta { font-size: 12px; color: var(--ink-soft); }

  /* ============================================================ NOT FOUND */
  .not-found {
    text-align: center; padding: 80px 20px;
    background: var(--bg-cream); border-radius: var(--radius-card);
    border: 1px dashed var(--ink-line);
  }
  .not-found h2 { font-family: 'Instrument Serif', serif; font-size: 36px; margin-bottom: 8px; }
  .not-found p { color: var(--ink-soft); margin-bottom: 18px; }
</style>

const BY_SLUG = {};
DATA.forEach(d => { BY_SLUG[d.slug] = d; });

function getSlugFromPath() {
  // Path is /school/<slug> or /school/<slug>/
  const m = window.location.pathname.match(/\/school\/([^/?#]+)/);
  if (m) return decodeURIComponent(m[1]);
  // Fallback: ?slug=xyz
  const params = new URLSearchParams(window.location.search);
  return params.get('slug');
}

function escapeHTML(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function ratingClass(r) {
  if (!r) return '';
  const k = r.toLowerCase().replace(/\s+/g,'-');
  if (k.startsWith('outstanding')) return 'rating-outstanding';
  if (k.startsWith('very-good')) return 'rating-very-good';
  if (k.startsWith('good')) return 'rating-good';
  if (k.startsWith('acceptable')) return 'rating-acceptable';
  if (k.startsWith('weak')) return 'rating-weak';
  return '';
}

function mapsURL(it) {
  const em = it.em.split(' (')[0];
  const q = encodeURIComponent(`${it.n} ${it.ar} ${em} UAE`);
  return `https://www.google.com/maps/search/?api=1&query=${q}`;
}

function nearbySchools(item, n) {
  // Same emirate, same/nearby area, exclude self
  const sameEmirate = DATA.filter(d => d.em === item.em && d.slug !== item.slug);
  // Prefer same area first
  const sameArea = sameEmirate.filter(d => d.ar === item.ar);
  const others = sameEmirate.filter(d => d.ar !== item.ar);
  return [...sameArea, ...others].slice(0, n);
}

function buildPage(item) {
  const enriched = !!item.r;
  const fee_clean = (item.fr || '').replace(/\u202F/g, ' ');
  const avg_clean = (item.af || '').replace(/\u202F/g, ' ');
  const aboutSentences = [];
  aboutSentences.push(`<strong>${escapeHTML(item.n)}</strong> is a ${item.t.toLowerCase()} located in <strong>${escapeHTML(item.ar)}, ${escapeHTML(item.em.split(' (')[0])}</strong>.`);
  if (item.c)  aboutSentences.push(`The school follows the <span class="accent">${escapeHTML(item.c)}</span> curriculum${item.ph ? ' across <strong>' + escapeHTML(item.ph) + '</strong> phase' : ''}.`);
  if (item.r)  aboutSentences.push(`The latest published inspection rating from ${item.auth} is <span class="accent">${escapeHTML(item.r)}</span>.`);
  if (fee_clean) aboutSentences.push(`Tuition fees range from <strong>${escapeHTML(fee_clean)}</strong> per year${avg_clean ? ', averaging ' + escapeHTML(avg_clean) : ''}, placing it in the ${item.b ? '<strong>' + escapeHTML(item.b) + '</strong>' : 'mid'} fee band.`);
  if (item.f)  aboutSentences.push(`Founded in <strong>${escapeHTML(item.f)}</strong>${item.op ? ', operated by <strong>' + escapeHTML(item.op) + '</strong>' : ''}.`);
  

  const aboutHTML = aboutSentences.map(s => `<p>${s}</p>`).join('');

  // Glance card rows
  const rows = [
    ['Type',           item.t],
    ['Emirate',        item.em],
    ['Area',           item.ar],
    ['Curriculum',     item.c || 'Not available'],
    ['Phase',          item.ph || '\u2014'],
    ['Latest Rating',  item.r ? `<span class="badge ${ratingClass(item.r)}" style="font-size:12px">${item.r}</span>` : 'Not available'],
    ['Authority',      item.auth],
    ['Avg Fee',        avg_clean || '\u2014'],
    ['Fee Range',      fee_clean || 'Not available'],
    ['Fee Band',       item.b || '\u2014'],
    ['Founded',        item.f || '\u2014'],
    ['Operator',       item.op || '\u2014'],
  ];
  const glanceHTML = rows.map(([k, v]) => `
    <div class="glance-row">
      <div class="glance-key">${escapeHTML(k)}</div>
      <div class="glance-value ${(!v || v === '\u2014' || v === 'Not available') ? 'muted' : ''}">${v}</div>
    </div>
  `).join('');

  const nearby = nearbySchools(item, 6);
  const nearbyHTML = nearby.map(n => `
    <a class="nearby-card" href="/school/${encodeURIComponent(n.slug)}">
      <h4>${escapeHTML(n.n)}</h4>
      <div class="nb-meta">${escapeHTML(n.ar)} \u00b7 ${escapeHTML(n.em)}</div>
      <div style="display:flex; gap:6px; flex-wrap:wrap; margin-top:4px">
        <span class="badge type-${n.t.toLowerCase()}">${n.t}</span>
        ${n.r ? `<span class="badge ${ratingClass(n.r)}">${n.r}</span>` : ''}
      </div>
    </a>
  `).join('');

  document.title = `${item.n} \u00b7 UAE School Finder`;
  document.getElementById('page-desc').setAttribute('content',
    `${item.n} \u2014 ${item.t} in ${item.ar}, ${item.em}. ` +
    (item.c ? `${item.c} curriculum. ` : '') +
    (item.r ? `${item.r} rating. ` : '') +
    (fee_clean ? `Fees: ${fee_clean}.` : '')
  );

  document.getElementById('content').innerHTML = `
    <section class="hero">
      <div class="container">
        <div class="breadcrumb">
          <a href="/">UAE School Finder</a>
          <span class="sep">\u203a</span>
          <a href="/?em=${encodeURIComponent(item.em)}">${escapeHTML(item.em)}</a>
          <span class="sep">\u203a</span>
          <span>${escapeHTML(item.n)}</span>
        </div>
        <div class="school-title-row">
          <div class="left">
            <h1>${escapeHTML(item.n)}</h1>
            <div class="school-meta">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
              ${escapeHTML(item.ar)}, ${escapeHTML(item.em)}
            </div>
            <div class="badge-row">
              <span class="badge type-${item.t.toLowerCase()}">${item.t}</span>
              <span class="badge">${item.auth}</span>
              ${item.c ? `<span class="badge">${escapeHTML(item.c)}</span>` : ''}
              ${item.r ? `<span class="badge ${ratingClass(item.r)}">${item.r}</span>` : ''}
              ${item.b ? `<span class="badge">${escapeHTML(item.b)}</span>` : ''}
            </div>
          </div>
        </div>
      </div>
    </section>
    <main>
      <div class="container detail-grid">
        <div>
          <div class="section-card info-prose">
            <h2>About ${escapeHTML(item.n)}</h2>
            ${aboutHTML}

            <div class="quick-contact">
              <div class="qc-item">
                <div class="qc-label">Curriculum</div>
                <div class="qc-value ${item.c ? '' : 'muted'}">${escapeHTML(item.c || 'Not available')}</div>
              </div>
              <div class="qc-item">
                <div class="qc-label">Phase</div>
                <div class="qc-value ${item.ph ? '' : 'muted'}">${escapeHTML(item.ph || 'Not available')}</div>
              </div>
              <div class="qc-item">
                <div class="qc-label">Annual Fees (AED)</div>
                <div class="qc-value ${fee_clean ? '' : 'muted'}">${escapeHTML(fee_clean || 'Not available')}</div>
              </div>
              <div class="qc-item">
                <div class="qc-label">Latest Rating</div>
                <div class="qc-value ${item.r ? '' : 'muted'}">${escapeHTML(item.r || 'Not available')}</div>
              </div>
            </div>
          </div>

          <div class="section-card">
            <h2>Nearby schools</h2>
            <p>Other ${escapeHTML(item.t.toLowerCase())}s and schools in ${escapeHTML(item.em)}.</p>
            <div class="nearby-grid">${nearbyHTML}</div>
          </div>

          <div class="section-card">
            <h2>Sources & further reading</h2>
            <p>Profile compiled from publicly available data. For the most current fee schedule, parent reviews, and full inspection report, see the official sources:</p>
            <ul>
              
              ${item.auth === 'KHDA' ? '' : ''}
              ${item.auth === 'ADEK' ? '' : ''}
              ${item.auth === 'SPEA' ? '' : ''}
              <li><a href="${mapsURL(item)}" target="_blank" rel="noopener" style="color: var(--accent); text-decoration: underline;">View on Google Maps</a></li>
            </ul>
          </div>
        </div>

        <aside>
          <div class="glance-card">
            <h3>At a glance</h3>
            <div class="glance-list">${glanceHTML}</div>
            <div class="glance-actions">
              <a class="action-btn primary" href="${mapsURL(item)}" target="_blank" rel="noopener">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
                Open in Google Maps
              </a>
              
            </div>
          </div>
        </aside>
      </div>
    </main>
  `;
}

function show404() {
  document.title = 'School not found · UAE School Finder';
  document.getElementById('content').innerHTML = `
    <section class="hero">
      <div class="container">
        <div class="not-found">
          <h2>School not found</h2>
          <p>We couldn\u2019t find a school matching that URL.</p>
          <a class="pill dark" href="/">Browse all schools</a>
        </div>
      </div>
    </section>
  `;
}

const slug = getSlugFromPath();
if (!slug || !BY_SLUG[slug]) {
  show404();
} else {
  buildPage(BY_SLUG[slug]);

window.REVIEWS = null;
(async function loadReviews() {
  try {
    const bytes = Uint8Array.from(atob(window.REVIEWS_GZ_B64), c => c.charCodeAt(0));
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const text = await new Response(stream).text();
    window.REVIEWS = JSON.parse(text);
    if (typeof renderCurrentSchool === 'function') renderCurrentSchool();
  } catch (e) { console.warn('reviews load failed', e); window.REVIEWS = {}; }
})();

function reviewSectionsHTML(slug) {
  if (!window.REVIEWS || !window.REVIEWS[slug]) return '';
  var r = window.REVIEWS[slug];
  function paraToHtml(text) { return text.split(/\n\n+/).map(function(p) { return '<p>' + escapeHTML(p).replace(/\n/g, '<br>') + '</p>'; }).join(''); }
  var html = '';
  if (r['School Overview']) html += '<div class="section-card info-prose"><h2>School Overview</h2>' + paraToHtml(r['School Overview']) + '</div>';
  if (r.keyfeatures && r.keyfeatures.length) html += '<div class="section-card info-prose"><h2>Key Features</h2><ul>' + r.keyfeatures.map(function(f){return '<li>'+escapeHTML(f)+'</li>';}).join('') + '</ul></div>';
  if (r['Fees & Admissions']) html += '<div class="section-card info-prose"><h2>Fees &amp; Admissions</h2>' + paraToHtml(r['Fees & Admissions']) + '</div>';
  if (r['Quality & Performance']) html += '<div class="section-card info-prose"><h2>Quality &amp; Performance</h2>' + paraToHtml(r['Quality & Performance']) + '</div>';
  if (r['Location & Facilities']) html += '<div class="section-card info-prose"><h2>Location &amp; Facilities</h2>' + paraToHtml(r['Location & Facilities']) + '</div>';
  if (r['Additional Information']) html += '<div class="section-card info-prose"><h2>Additional Information</h2>' + paraToHtml(r['Additional Information']) + '</div>';
  return html;
}

function renderCurrentSchool() {
  var slug = (typeof getSlugFromPath === 'function') ? getSlugFromPath() : null;
  if (slug && typeof BY_SLUG !== 'undefined' && BY_SLUG[slug] && typeof buildPage === 'function') buildPage(BY_SLUG[slug]);
}

(function() {
  var __orig = window.buildPage;
  if (!__orig) return;
  window.buildPage = function(item) {
    __orig(item);
    if (window.REVIEWS && window.REVIEWS[item.slug]) {
      var sections = reviewSectionsHTML(item.slug);
      if (sections) {
        var content = document.getElementById('content');
        var firstCard = content.querySelector('.detail-grid > div > .section-card');
        if (firstCard) firstCard.insertAdjacentHTML('afterend', sections);
        else { var col = content.querySelector('.detail-grid > div'); if (col) col.insertAdjacentHTML('afterbegin', sections); }
      }
    }
  };
})();

</script>
